data:
  dataset: dataset_c
  seed: 42
model:
  d_model: 64
  n_heads: 8
  n_layers: 2
  d_ffn: 128
  dropout: 0.07633
  pool: mean
  tokenizer: periodic
  use_reglu: true
  layer_scale: 0.01
  deep_head: true
  head_width: 256
train:
  batch_size: 64
  epochs: 300
  lr: 0.002297115827844087
  weight_decay: 6.292459606173138e-05
  patience: 20
  clip_min: 0.0
loss:
  lam_bounds: 1.0
  lam_tolerance: 0.7344253793640163
  lam_monotonicity: 1.0
